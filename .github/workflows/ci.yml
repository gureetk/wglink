name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet -tags integration ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: install busybox
        # Node scripts are tested under busybox sh too, as on Alpine.
        run: command -v busybox || { sudo apt-get update -qq && sudo apt-get install -y -qq busybox; }
      - name: go test
        run: |
          status=0
          go test -race -count=1 ./... > test.log 2>&1 || status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            # Attach the failures to the run so they show on the pull request.
            msg=$(grep -v -e '^ok ' -e '^?  ' test.log | tail -n 150 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=go test failed::$msg"
          fi
          exit "$status"

  integration:
    # Real WireGuard: two nodes in network namespaces, one more over SSH, and
    # this runner itself through systemd. See test/integration.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: install WireGuard and OpenSSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wireguard-tools openssh-server
          sudo modprobe wireguard
      - name: go test
        env:
          WGLINK_INTEGRATION: "1"
          WGLINK_INTEGRATION_HOST: "1"
        run: |
          status=0
          go test -tags integration -count=1 -v ./test/integration/ > test.log 2>&1 || status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 150 test.log | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=integration tests failed::$msg"
          fi
          # Show which nodes took part, and any tests skipped, on the run's summary.
          echo "::notice title=integration lab::$(grep -m 1 -o 'addresses: .*' test.log || echo 'no lab started')"
          echo "::notice title=skipped tests::$(grep -o -- '--- SKIP: [^ ]*' test.log | cut -d ' ' -f 3 | paste -sd ' ' - | grep . || echo none)"
          exit "$status"
